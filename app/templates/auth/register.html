{% extends "base.html" %}

{% block content %}
<section class="auth-section" aria-labelledby="register-heading">
    <div class="card auth-card">
        <h1 id="register-heading" class="auth-title">Регистрация</h1>
        <p class="auth-subtitle">Создайте аккаунт гостя кофейни за пару секунд.</p>

        <div id="auth-error" class="alert alert-error" role="alert" aria-live="polite" hidden></div>
        <div id="auth-success" class="alert alert-success" role="status" aria-live="polite" hidden></div>

        <form id="auth-form" class="auth-form" data-endpoint="/auth/register" data-mode="register" novalidate>
            <div class="form-field">
                <label for="email" class="form-label">Электронная почта</label>
                <input
                    id="email"
                    name="email"
                    type="email"
                    class="form-input"
                    autocomplete="email"
                    placeholder="you@example.com"
                    required
                >
            </div>

            <div class="form-field">
                <label for="password" class="form-label">Пароль</label>
                <input
                    id="password"
                    name="password"
                    type="password"
                    class="form-input"
                    autocomplete="new-password"
                    minlength="8"
                    placeholder="Минимум 8 символов"
                    required
                >
            </div>

            <div class="form-field">
                <label for="password-confirm" class="form-label">Повторите пароль</label>
                <input
                    id="password-confirm"
                    name="password_confirm"
                    type="password"
                    class="form-input"
                    autocomplete="new-password"
                    minlength="8"
                    placeholder="Повторите пароль"
                    required
                >
            </div>

            <button type="submit" class="btn btn-primary btn-block" id="auth-submit">
                Создать аккаунт
            </button>
        </form>

        <p class="auth-footer">
            Уже есть аккаунт? <a href="/auth/login">Войти</a>
        </p>
    </div>
</section>
{% endblock %}

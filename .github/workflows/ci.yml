name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: coffee_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: coffee_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U coffee_user -d coffee_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install system fonts for PDF receipts
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-dejavu-core

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run ruff linter
        run: ruff check .

      - name: Run Alembic migrations on test PostgreSQL
        env:
          DATABASE_URL: postgresql+asyncpg://coffee_user:test_password@127.0.0.1:5432/coffee_test
          SECRET_KEY: ci-test-secret-key-at-least-32-chars
        run: alembic upgrade head

      - name: Run pytest suite (unit + PostgreSQL E2E)
        env:
          DATABASE_URL: postgresql+asyncpg://coffee_user:test_password@127.0.0.1:5432/coffee_test
          TEST_DATABASE_URL: postgresql+asyncpg://coffee_user:test_password@127.0.0.1:5432/coffee_test
          SECRET_KEY: ci-test-secret-key-at-least-32-chars
        run: pytest -q
